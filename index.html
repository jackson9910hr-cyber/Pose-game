<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thanksgiving Pose Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Black+Han+Sans&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a projector stage. Header with sets, a huge word on the left, a countdown dial on the right, controls along the bottom. Single deliberate dark harvest look for big screens. */
:root{
  --bg:#1c2419;          /* deep field green */
  --bg-2:#26301f;
  --panel:#2f3a27;
  --ink:#f6eedc;         /* parchment */
  --muted:#b9b29c;
  --gold:#e8b44a;        /* harvest wheat */
  --pumpkin:#e2733b;
  --berry:#b8425a;
  --line:rgba(246,238,220,.14);
  --f-display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --f-ko:"Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body:"Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding-left:max(24px, env(safe-area-inset-left,0px));padding-right:max(24px, env(safe-area-inset-right,0px));padding-block:18px;
  background:
    radial-gradient(1200px 600px at 85% 110%, rgba(226,115,59,.18), transparent 60%),
    radial-gradient(900px 500px at -10% -20%, rgba(232,180,74,.12), transparent 60%),
    var(--bg);}

/* header */
header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(26px,3vw,44px);letter-spacing:.02em;line-height:1}
.brand h1 span{color:var(--gold)}
.brand .ko{font-family:var(--f-ko);font-size:clamp(18px,1.8vw,26px);color:var(--pumpkin)}
.brand .sub{font-size:14px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
.sets{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.sets button{border:1px solid var(--line);background:transparent;padding:9px 14px;border-radius:999px;font-family:var(--f-display);font-weight:800;letter-spacing:.06em;font-size:15px}
.sets button[aria-pressed="true"]{background:var(--gold);color:#22190a;border-color:var(--gold)}

/* stage */
main{position:relative;display:grid;place-items:center;padding-block:clamp(16px,3vh,40px);text-align:center}
.word{max-width:min(1500px,100%)}
.meta{justify-content:center}
.hint{margin-inline:auto}
.countlay{position:absolute;inset:0;display:grid;place-items:center;z-index:4;border-radius:28px;
  background:rgba(28,36,25,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.countlay .dial{width:min(52vh,40vw,520px)}
.countlay .num{font-size:min(34vh,26vw,340px);color:#fff8ea;text-shadow:0 6px 30px rgba(0,0,0,.35);opacity:.92}
.word{min-width:0}
.meta{display:flex;align-items:center;gap:14px;margin-bottom:clamp(10px,2vh,24px);flex-wrap:wrap}
.qno{font-family:var(--f-display);font-weight:800;font-size:clamp(18px,1.8vw,28px);color:var(--gold);font-variant-numeric:tabular-nums}
.chip{font-size:clamp(14px,1.2vw,18px);padding:6px 14px;border-radius:999px;background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.chip.bible{background:rgba(232,180,74,.16);border-color:rgba(232,180,74,.5);color:var(--gold)}
.chip.church{background:rgba(184,66,90,.18);border-color:rgba(184,66,90,.55);color:#f2a7b6}
.en{font-family:var(--f-display);font-weight:800;line-height:.95;letter-spacing:-.01em;margin:0;font-size:clamp(56px,10vw,190px);text-wrap:balance;overflow-wrap:anywhere}
.ko-word{font-family:var(--f-ko);font-size:clamp(34px,5.2vw,96px);color:var(--pumpkin);margin-top:clamp(10px,2vh,26px);line-height:1.1;text-wrap:balance}
.hint{margin-top:clamp(12px,2vh,24px);font-size:clamp(18px,1.8vw,30px);color:var(--muted);line-height:1.4;max-width:40ch}
.hint b{color:var(--ink);font-weight:400}

/* countdown dial */
.dial{position:relative;width:clamp(200px,26vw,420px);aspect-ratio:1;max-width:100%}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .track{stroke:var(--line);fill:none}
.dial .prog{stroke:var(--gold);fill:none;stroke-linecap:round;transition:stroke-dashoffset .95s linear, stroke .3s}
.dial .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(110px,15vw,260px);font-variant-numeric:tabular-nums;line-height:1}
.dial .num.pop{animation:pop .9s cubic-bezier(.2,1.4,.4,1)}
.dial .ready{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:clamp(16px,1.4vw,22px);color:var(--muted);padding:20%}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.12);opacity:.95}100%{transform:scale(1);opacity:.85}}

/* action overlay */
.action{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center, rgba(226,115,59,.92), rgba(184,66,90,.95));border-radius:28px;z-index:5}
.action .t{font-family:var(--f-display);font-weight:800;font-size:clamp(90px,17vw,320px);letter-spacing:.02em;color:#fff8ea;text-shadow:0 8px 0 rgba(0,0,0,.18);animation:slam .5s cubic-bezier(.2,1.6,.4,1)}
.action .k{font-family:var(--f-ko);font-size:clamp(28px,3.4vw,60px);color:#fff1d6;margin-top:-1vh}
.action .inner{text-align:center}
body.locked footer button,body.locked .sets button{opacity:.35;cursor:not-allowed}
@keyframes slam{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}

/* interstitial cards (set intro / set done) */
.card{position:absolute;inset:0;display:grid;place-items:center;text-align:center;z-index:6;background:var(--bg)}
.card .big{font-family:var(--f-display);font-weight:800;font-size:clamp(80px,14vw,260px);line-height:.9;color:var(--gold)}
.card .ko{font-family:var(--f-ko);font-size:clamp(28px,3.6vw,64px);margin-top:16px}
.card .en-line{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,3.8vw,68px);margin-top:16px;line-height:1.1}
.card .ko{font-size:clamp(20px,2.2vw,38px)!important;color:var(--pumpkin);margin-top:8px!important}
.card .p-en{color:var(--ink)}
.ready .rd-en{font-family:var(--f-display);font-weight:800;color:var(--ink);font-size:clamp(22px,2vw,34px)}
.card p{color:var(--muted);font-size:clamp(16px,1.5vw,24px);margin:14px 0 28px}
.cta{background:var(--pumpkin);border:0;padding:16px 34px;border-radius:999px;font-family:var(--f-display);font-weight:800;font-size:clamp(18px,1.6vw,26px);color:#1f1208}

/* footer controls */
footer{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;font-size:12px;font-family:var(--f-display);font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.dots button.done{background:var(--panel);color:var(--ink)}
.dots button.cur{background:var(--gold);color:#22190a;border-color:var(--gold)}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.ctrls button{background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:15px}
.ctrls button.primary{background:var(--gold);color:#22190a;border-color:var(--gold);font-weight:700}
.keys{font-size:13px;color:var(--muted)}
kbd{font-family:var(--f-display);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:12px}

/* Fit-to-screen: every size is capped by both width and height so the whole stage fits one screen on desktop, tablet and phone */
.app{height:100vh;height:100dvh;overflow:hidden}
main{min-height:0;overflow:hidden;padding-block:clamp(8px,2vh,40px)}
.word{max-height:100%}
.en{font-size:clamp(34px,min(10vw,16vh),190px)}
.ko-word{font-size:clamp(22px,min(5.2vw,8vh),96px);margin-top:clamp(6px,1.6vh,26px)}
.hint{font-size:clamp(14px,min(1.8vw,3.2vh),30px);margin-top:clamp(6px,1.6vh,24px)}
.meta{margin-bottom:clamp(6px,1.6vh,24px)}
.countlay .dial{width:min(58vh,70vw,520px)}
.countlay .num{font-size:min(36vh,44vw,340px)}
.action .t{font-size:clamp(56px,min(17vw,26vh),320px)}
.action .k{font-size:clamp(22px,min(3.4vw,6vh),60px)}
.card .big{font-size:clamp(48px,min(14vw,20vh),260px)}
.card .en-line{font-size:clamp(22px,min(3.8vw,7vh),68px);margin-top:clamp(6px,1.4vh,16px)}
.card p{font-size:clamp(14px,min(1.5vw,2.8vh),24px);margin:clamp(8px,1.4vh,14px) 0 clamp(14px,2.6vh,28px)}
.card > div{padding-inline:12px}

/* Phones and narrow tablets (portrait) */
@media (max-width:760px){
  .app{padding-left:max(12px, env(safe-area-inset-left,0px));padding-right:max(12px, env(safe-area-inset-right,0px));padding-block:10px;gap:0}
  header{gap:8px;padding-bottom:8px;justify-content:center}
  .brand{gap:8px;justify-content:center;width:100%}
  .brand h1{font-size:22px}
  .brand .ko{font-size:16px}
  .brand .sub{display:none}
  .sets{width:100%;justify-content:center;gap:6px}
  .sets{display:grid;grid-template-columns:repeat(4,1fr)}
  .sets button{padding:7px 0;font-size:12px;letter-spacing:.02em}
  .chip{font-size:12px;padding:4px 10px}
  .qno{font-size:15px}
  .en{font-size:clamp(30px,min(13vw,10vh),80px);line-height:1}
  .ko-word{font-size:clamp(20px,min(7.5vw,6vh),44px)}
  .hint{font-size:clamp(13px,min(4vw,2.6vh),18px)}
  footer{flex-direction:column;align-items:stretch;gap:8px;padding-top:8px}
  .dots{justify-content:center;gap:5px;flex-wrap:nowrap}
  .dots button{width:26px;height:26px;font-size:11px;padding:0;flex:none}
  .ctrls{display:grid;grid-template-columns:1fr 1.6fr 1fr;grid-template-areas:"prev start next" "sound sound full";gap:6px}
  #prev{grid-area:prev} #start{grid-area:start} #next{grid-area:next} #sound{grid-area:sound} #full{grid-area:full}
  .ctrls button{padding:10px 6px;font-size:14px;white-space:nowrap}
  #sound,#full{padding:6px;font-size:12px}
  .keys{display:none}
  .action,.countlay{border-radius:18px}
  .cta{padding:12px 24px;font-size:17px}
}

/* Short screens: phones held sideways, small laptops */
@media (max-height:520px){
  .app{padding-block:6px}
  header{padding-bottom:6px;flex-wrap:nowrap}
  .brand .ko,.brand .sub{display:none}
  .brand{width:auto}
  .brand h1{font-size:18px}
  .sets{width:auto}
  .sets{display:flex}
  .sets button{padding:5px 8px;font-size:11px}
  footer{flex-direction:row;flex-wrap:nowrap;padding-top:6px;gap:8px}
  .dots{display:none}
  .ctrls{display:flex;width:100%;justify-content:center}
  .ctrls button{padding:7px 10px;font-size:12px}
  .keys{display:none}
  .meta{margin-bottom:4px}
  .chip{font-size:11px;padding:3px 8px}
  .qno{font-size:13px}
  .en{font-size:clamp(26px,min(9vw,17vh),90px)}
  .ko-word{font-size:clamp(16px,min(5vw,9vh),44px);margin-top:4px}
  .hint{font-size:12px;margin-top:4px;line-height:1.3}
  .card p{margin:6px 0 10px}
  .cta{padding:8px 20px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .dial .num.pop,.action .t{animation:none}
  .dial .prog{transition:none}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand">
      <h1>POSE <span>GAME</span></h1>
      <div class="ko">포즈 게임</div>
      <div class="sub">Thanksgiving Festival · 2026</div>
    </div>
    <div class="sets" role="group" aria-label="세트 선택">
      <button id="set-p" data-set="0" aria-pressed="true">PRACTICE</button>
      <button id="set-1" data-set="1" aria-pressed="false">SET 1</button>
      <button id="set-2" data-set="2" aria-pressed="false">SET 2</button>
      <button id="set-3" data-set="3" aria-pressed="false">SET 3</button>
      <button id="set-4" data-set="4" aria-pressed="false">SET 4</button>
      <button id="set-5" data-set="5" aria-pressed="false">SET 5</button>
      <button id="set-6" data-set="6" aria-pressed="false">SET 6</button>
    </div>
  </header>

  <main id="stage">
    <section class="word" aria-live="polite">
      <div class="meta">
        <span class="qno" id="qno">Q1 / 10</span>
        <span class="chip" id="cat">Animal · 동물</span>
      </div>
      <h2 class="en" id="en">Rabbit</h2>
      <div class="ko-word" id="ko">토끼</div>
      <div class="hint" id="hint" hidden></div>
    </section>

    <div class="countlay" id="countlay" hidden>
    <div class="dial" aria-label="Countdown">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="track" cx="50" cy="50" r="44" stroke-width="6"></circle>
        <circle class="prog" id="prog" cx="50" cy="50" r="44" stroke-width="6"></circle>
      </svg>
      <div class="num" id="num" hidden>5</div>
      <div class="ready" id="ready" hidden></div>
    </div>
    </div>

    <div class="action" id="action" hidden>
      <div class="inner"><div class="t">ACTION!</div><div class="k">포즈!</div></div>
    </div>

    <div class="card" id="card">
      <div>
        <div class="big" id="cardBig">PRACTICE</div>
        <div class="en-line" id="cardEn">Team, come on up!</div>
        <div class="ko" id="cardKo">팀 입장!</div>
        <p id="cardP"><span class="p-en" id="cardPen"></span><br><span id="cardPko"></span></p>
        <button class="cta" id="cardBtn">Start Practice ▶</button>
      </div>
    </div>
  </main>

  <footer>
    <div class="dots" id="dots" aria-label="문제 번호"></div>
    <div class="ctrls">
      <button id="prev">◀ Prev</button>
      <button id="start" class="primary">START 5·4·3·2·1</button>
      <button id="next">Next ▶</button>
      <button id="sound" aria-pressed="true">🔊 Sound On</button>
      <button id="full">⛶ Fullscreen</button>
    </div>
    <div class="keys"><kbd>Space</kbd> Countdown → Next · <kbd>←</kbd><kbd>→</kbd> Move · <kbd>F</kbd> Fullscreen · <kbd>0</kbd>–<kbd>6</kbd> Set</div>
  </footer>
</div>

<script>
const CAT = {
  animal:{en:"Animal",ko:"동물",cls:""},
  hero:{en:"Character",ko:"캐릭터",cls:""},
  sport:{en:"Sports",ko:"스포츠",cls:""},
  church:{en:"Church Life",ko:"교회 웃음",cls:"church"},
  bible:{en:"Bible",ko:"성경 인물",cls:"bible"},
  practice:{en:"Practice",ko:"연습 문제",cls:""}
};
const LABELS = ["PRACTICE","SET 1","SET 2","SET 3","SET 4","SET 5","SET 6"];
const SETS = [
  [
    {c:"practice",en:"Cat",ko:"고양이"},
    {c:"practice",en:"Taking a Selfie",ko:"셀카 찍는 사람"}
  ],
  [
    {c:"animal",en:"Rabbit",ko:"토끼"},
    {c:"animal",en:"Butterfly",ko:"나비"},
    {c:"hero",en:"Spider-Man",ko:"스파이더맨"},
    {c:"sport",en:"Bowling",ko:"볼링"},
    {c:"church",en:"Worship Team Drummer",ko:"찬양팀 드러머"},
    {c:"bible",en:"David",ko:"다윗",hen:"Slung a stone at Goliath",hko:"물맷돌로 골리앗을 쓰러뜨린 소년"}
  ],
  [
    {c:"animal",en:"Penguin",ko:"펭귄"},
    {c:"animal",en:"Eagle",ko:"독수리"},
    {c:"hero",en:"Superman",ko:"슈퍼맨"},
    {c:"sport",en:"Baseball",ko:"야구"},
    {c:"church",en:"Choir Member",ko:"성가대원"},
    {c:"bible",en:"Moses",ko:"모세",hen:"Parted the Red Sea",hko:"지팡이를 들어 홍해를 가른 사람"}
  ],
  [
    {c:"animal",en:"Elephant",ko:"코끼리"},
    {c:"animal",en:"Frog",ko:"개구리"},
    {c:"hero",en:"Terminator",ko:"터미네이터"},
    {c:"sport",en:"Golf",ko:"골프"},
    {c:"church",en:"Parent Holding a Baby in Service",ko:"아기 안고 예배드리는 부모"},
    {c:"bible",en:"Zacchaeus",ko:"삭개오",hen:"Climbed a tree to see Jesus",hko:"나무 위에 올라가 예수님을 만난 키 작은 세리"}
  ],
  [
    {c:"animal",en:"Gorilla",ko:"고릴라"},
    {c:"animal",en:"Kangaroo",ko:"캥거루"},
    {c:"hero",en:"Statue of Liberty",ko:"자유의 여신상"},
    {c:"sport",en:"Figure Skating",ko:"피겨 스케이팅"},
    {c:"church",en:"Parking Attendant",ko:"주차 안내하는 봉사자"},
    {c:"bible",en:"Samson",ko:"삼손",hen:"Beat a lion, pushed down the pillars",hko:"사자를 이기고 기둥을 무너뜨린 장사"}
  ],
  [
    {c:"animal",en:"Monkey",ko:"원숭이"},
    {c:"animal",en:"Lion",ko:"사자"},
    {c:"hero",en:"Ultraman",ko:"울트라맨"},
    {c:"sport",en:"Archery",ko:"양궁"},
    {c:"church",en:"Worship Team Guitarist",ko:"찬양팀 기타리스트"},
    {c:"bible",en:"Peter",ko:"베드로",hen:"Walked on water toward Jesus",hko:"예수님을 따라 물 위를 걸은 제자"}
  ],
  [
    {c:"animal",en:"Duck",ko:"오리"},
    {c:"animal",en:"T-Rex",ko:"티라노사우루스"},
    {c:"hero",en:"The Thinker",ko:"생각하는 사람"},
    {c:"sport",en:"Weightlifting",ko:"역도"},
    {c:"church",en:"Greeter Welcoming Newcomers",ko:"새가족을 반갑게 맞는 안내 봉사자"},
    {c:"bible",en:"Noah",ko:"노아",hen:"Built the ark with a hammer",hko:"망치로 방주를 지은 사람"}
  ]
];

const $ = id => document.getElementById(id);
const R = 44, C = 2*Math.PI*R;
const prog = $("prog");
prog.style.strokeDasharray = C;

let set = 0, q = 0, timer = null, running = false, soundOn = true, actx = null;

function beep(freq, dur, type="sine", vol=.25){
  if(!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

function stopCount(){
  clearTimeout(timer); timer = null; running = false;
  $("action").hidden = true;
  $("countlay").hidden = true;
  $("num").hidden = true;
  prog.style.transition = "none";
  prog.style.strokeDashoffset = 0;
  prog.style.stroke = "var(--gold)";
}

function render(){
  stopCount();
  const item = SETS[set][q];
  const cat = CAT[item.c];
  $("qno").textContent = (set===0 ? `Practice ${q+1} / ` : `Q${q+1} / `) + SETS[set].length;
  $("cat").textContent = `${cat.en} · ${cat.ko}`;
  $("cat").className = "chip " + cat.cls;
  $("en").textContent = item.en;
  $("ko").textContent = item.ko;
  if(item.hen){
    $("hint").hidden = false;
    $("hint").innerHTML = `<b>${item.hen}</b><br>${item.hko}`;
  } else { $("hint").hidden = true; }
  document.querySelectorAll(".sets button").forEach((b,i)=>b.setAttribute("aria-pressed", i===set));
  const dots = $("dots"); dots.innerHTML = "";
  SETS[set].forEach((_,i)=>{
    const b = document.createElement("button");
    b.id = `dot-${i+1}`;
    b.textContent = i+1;
    b.className = i===q ? "cur" : (i<q ? "done" : "");
    b.setAttribute("aria-label", `${i+1}번 문제`);
    b.onclick = () => { q = i; render(); };
    dots.appendChild(b);
  });
}

function startCount(){
  if(!$("card").hidden) return;
  stopCount();
  running = true;
  document.body.classList.add("locked");
  $("countlay").hidden = false;
  let n = 5;
  const tick = () => {
    if(n === 0){
      $("num").hidden = true;
      $("countlay").hidden = true;
      $("action").hidden = false;
      beep(660,.18,"square",.22); setTimeout(()=>beep(990,.5,"square",.22),160);
      running = false;
      document.body.classList.remove("locked");
      return;
    }
    const num = $("num");
    num.hidden = false; num.textContent = n;
    num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
    prog.style.stroke = n <= 2 ? "var(--pumpkin)" : "var(--gold)";
    prog.style.transition = "none";
    prog.style.strokeDashoffset = C * (1 - n/5);
    void prog.getBoundingClientRect();
    prog.style.transition = "stroke-dashoffset .95s linear, stroke .3s";
    prog.style.strokeDashoffset = C * (1 - (n-1)/5);
    beep(n<=2 ? 660 : 520, .15, "sine", .2);
    n--;
    timer = setTimeout(tick, 1000);
  };
  tick();
}

function showCard(kind){
  stopCount();
  const c = $("card"); c.hidden = false;
  if(kind === "intro"){
    $("cardBig").textContent = set===0 ? "PRACTICE" : LABELS[set];
    $("cardEn").textContent = set===0 ? "Two warm-up rounds!" : "Team, come on up!";
    $("cardKo").textContent = set===0 ? "연습 문제 2개로 몸 풀기!" : "팀 입장!";
    $("cardPen").textContent = set===0 ? "No points. When ACTION appears, everyone strikes the same pose." : "4–5 members, stand in one line facing the audience. No talking!";
    $("cardPko").textContent = set===0 ? "점수 없이 규칙만 익혀요. ACTION이 뜨면 모두 같은 포즈!" : "팀원 4~5명이 관객을 보고 한 줄로 서 주세요. 말하기 금지!";
    $("cardBtn").textContent = set===0 ? "Start Practice ▶" : "Let's Go ▶";
    $("cardBtn").onclick = () => { c.hidden = true; q = 0; render(); };
  } else {
    const last = set === SETS.length-1;
    $("cardBig").textContent = last ? "THE END" : (set===0 ? "READY?" : `${LABELS[set]} DONE!`);
    $("cardEn").textContent = last ? "Thank you all!" : (set===0 ? "Now it's for real!" : "Great job!");
    $("cardKo").textContent = last ? "모두 수고하셨습니다!" : (set===0 ? "연습 끝! 이제 진짜 게임입니다" : "수고하셨습니다!");
    $("cardPen").textContent = last ? "Happy Thanksgiving! Give thanks in all circumstances. — 1 Thess. 5:18" : (set===0 ? "SET 1 team, please come forward." : "Next team, please come forward.");
    $("cardPko").textContent = last ? "범사에 감사하라 (살전 5:18) · 감사가 넘치는 한 주 되세요" : (set===0 ? "SET 1 팀은 앞으로 나와 주세요." : "다음 팀은 앞으로 나와 주세요.");
    $("cardBtn").textContent = last ? "Back to Start ↺" : `Start ${LABELS[set+1]} ▶`;
    $("cardBtn").onclick = () => { set = last ? 0 : set+1; q = 0; render(); showCard("intro"); };
  }
}

function next(){
  if(!$("card").hidden) return $("cardBtn").click();
  if(q < SETS[set].length-1){ q++; render(); } else showCard("done");
}
function prev(){
  if(!$("card").hidden){ $("card").hidden = true; render(); return; }
  if(q > 0){ q--; render(); }
}

$("start").onclick = startCount;
$("next").onclick = next;
$("prev").onclick = prev;
document.querySelectorAll(".sets button").forEach(b => b.onclick = () => {
  set = +b.dataset.set; q = 0; render(); showCard("intro");
});
$("sound").onclick = () => {
  soundOn = !soundOn;
  $("sound").setAttribute("aria-pressed", soundOn);
  $("sound").textContent = soundOn ? "🔊 Sound On" : "🔇 Sound Off";
};
$("full").onclick = () => {
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }catch(e){}
};
// While 5-4-3-2-1 runs, every button and key is ignored so the count can't restart or stop.
document.addEventListener("click", e => {
  if(running && e.target.closest("button")){ e.preventDefault(); e.stopImmediatePropagation(); }
}, true);
// Buttons don't keep keyboard focus, so Space never re-presses the last clicked button.
document.addEventListener("mousedown", e => { if(e.target.closest("button")) e.preventDefault(); });
document.addEventListener("keyup", e => { if(e.key === " ") e.preventDefault(); });
document.addEventListener("keydown", e => {
  if(running){ e.preventDefault(); return; }
  if(e.key === " "){
    e.preventDefault();
    if(!$("card").hidden) $("cardBtn").click();      // intro / end card → continue
    else if(!$("action").hidden) next();             // ACTION! shown → next question
    else startCount();                               // word shown → 5-4-3-2-1
  }
  else if(e.key === "Enter"){
    e.preventDefault();
    if(!$("card").hidden) $("cardBtn").click(); else startCount();
  }
  else if(e.key === "ArrowRight" || e.key === "PageDown") next();
  else if(e.key === "ArrowLeft" || e.key === "PageUp") prev();
  else if(e.key === "f" || e.key === "F") $("full").click();
  else if(e.key >= "0" && e.key <= "6"){ set = +e.key; q = 0; render(); showCard("intro"); }
});

render();
showCard("intro");
</script>
</body>
</html>
